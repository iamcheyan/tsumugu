<div class="audio-player d-flex flex-column h-100 p-3">
    <div class="player-info mb-4">
        <div class="player-filename fw-semibold mb-1"><i class="bi bi-music-note-beamed me-2 text-primary"></i>{{ filename }}</div>
        <div class="player-filepath small text-muted text-break">{{ filepath }}</div>
    </div>

    <div class="player-controls d-flex flex-column gap-3">
        <button class="play-pause-btn btn btn-primary rounded-circle mx-auto d-flex align-items-center justify-content-center" id="play-pause-btn" onclick="togglePlayPause()" style="width: 64px; height: 64px;">
            <i class="bi bi-play-fill fs-3" id="play-pause-icon"></i>
        </button>

        <div class="d-flex align-items-center gap-2">
            <span class="current-time small text-muted" id="current-time" style="min-width: 40px; font-family: monospace;">0:00</span>
            <div class="progress flex-grow-1" style="height: 6px; cursor: pointer;" id="progress-bar" onclick="seekTo(event)">
                <div class="progress-bar bg-primary rounded" id="progress-fill" style="width: 0%; transition: width 0.1s linear;"></div>
            </div>
            <span class="total-duration small text-muted" id="total-duration" style="min-width: 40px; font-family: monospace; text-align: right;">0:00</span>
        </div>
    </div>

    <audio id="audio-element" preload="metadata">
        <source src="/api/audio/stream?path={{ filepath }}" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</div>

<script>
    const audioElement = document.getElementById('audio-element');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playPauseIcon = document.getElementById('play-pause-icon');
    const progressFill = document.getElementById('progress-fill');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const progressBar = document.getElementById('progress-bar');
    let isPlaying = false;
    let isDragging = false;

    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
    }

    function togglePlayPause() {
        if (isPlaying) { audioElement.pause(); playPauseIcon.className = 'bi bi-play-fill fs-3'; isPlaying = false; }
        else { audioElement.play(); playPauseIcon.className = 'bi bi-pause-fill fs-3'; isPlaying = true; }
    }

    function updateProgress() {
        if (!isDragging && audioElement.duration) {
            progressFill.style.width = (audioElement.currentTime / audioElement.duration * 100) + '%';
            currentTimeEl.textContent = formatTime(audioElement.currentTime);
        }
    }

    function seekTo(event) {
        const rect = progressBar.getBoundingClientRect();
        const percent = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
        if (audioElement.duration) { audioElement.currentTime = percent * audioElement.duration; updateProgress(); }
    }

    progressBar.addEventListener('mousedown', (e) => { isDragging = true; seekTo(e); });
    document.addEventListener('mousemove', (e) => { if (isDragging) seekTo(e); });
    document.addEventListener('mouseup', () => { isDragging = false; });

    audioElement.addEventListener('loadedmetadata', () => { totalDurationEl.textContent = formatTime(audioElement.duration); });
    audioElement.addEventListener('timeupdate', updateProgress);
    audioElement.addEventListener('ended', () => { playPauseIcon.className = 'bi bi-play-fill fs-3'; isPlaying = false; progressFill.style.width = '0%'; currentTimeEl.textContent = '0:00'; });
    audioElement.addEventListener('error', (e) => {
        console.error('Audio error:', e);
        document.querySelector('.player-info').innerHTML += '<div class="alert alert-danger mt-2 py-1 small mb-0"><i class="bi bi-exclamation-circle me-1"></i>Error loading audio file</div>';
    });
</script>
