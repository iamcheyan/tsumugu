<!-- Toast Notification Container -->
<div id="toast-container" style="position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px;"></div>

<!-- Confirm Dialog -->
<div id="confirm-dialog" class="modal" style="display: none;">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content" style="background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);">
            <div class="modal-body text-center p-4">
                <div id="confirm-icon" class="mb-3 fs-1"></div>
                <h6 id="confirm-title" class="fw-semibold mb-2"></h6>
                <p id="confirm-message" class="text-muted small mb-0"></p>
            </div>
            <div class="modal-footer border-0 justify-content-center gap-2 pb-3">
                <button id="confirm-cancel-btn" class="btn btn-outline-secondary btn-sm px-3" onclick="confirmDialogResolve(false)">Cancel</button>
                <button id="confirm-ok-btn" class="btn btn-primary btn-sm px-3" onclick="confirmDialogResolve(true)">OK</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== Toast Notification ====================
    function showToast(message, type = 'info', duration = 3000) {
        // Log to activity panel (persistent)
        if (typeof addActivityLog === 'function') {
            addActivityLog(message, type);
        }

        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');

        let bgColor, icon, borderColor;
        switch (type) {
            case 'success':
                bgColor = 'rgba(34, 197, 94, 0.15)';
                borderColor = '#22c55e';
                icon = '✓';
                break;
            case 'error':
                bgColor = 'rgba(239, 68, 68, 0.15)';
                borderColor = '#ef4444';
                icon = '✗';
                break;
            case 'warning':
                bgColor = 'rgba(251, 191, 36, 0.15)';
                borderColor = '#fbbf24';
                icon = '⚠';
                break;
            default:
                bgColor = 'rgba(96, 165, 250, 0.15)';
                borderColor = '#60a5fa';
                icon = 'ℹ';
        }

        toast.style.cssText = `
            background: ${bgColor};
            border: 1px solid ${borderColor};
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--bs-body-color);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            animation: toastIn 0.3s ease;
            max-width: 420px;
            backdrop-filter: blur(10px);
        `;
        toast.innerHTML = `
            <span style="font-size: 1.1rem; color: ${borderColor};">${icon}</span>
            <span style="flex: 1; white-space: pre-line;">${message}</span>
            <button style="background: none; border: none; color: var(--bs-secondary-color); cursor: pointer; font-size: 1.1rem; padding: 0 4px;" onclick="this.parentElement.remove()">×</button>
        `;
        container.appendChild(toast);

        // Auto remove toast (but activity log stays)
        if (duration > 0) {
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.animation = 'toastOut 0.3s ease forwards';
                    setTimeout(() => toast.remove(), 300);
                }
            }, duration);
        }
    }

    // Add animation styles
    if (!document.getElementById('toast-styles')) {
        const style = document.createElement('style');
        style.id = 'toast-styles';
        style.textContent = `
            @keyframes toastIn {
                from { opacity: 0; transform: translateX(40px); }
                to { opacity: 1; transform: translateX(0); }
            }
            @keyframes toastOut {
                from { opacity: 1; transform: translateX(0); }
                to { opacity: 0; transform: translateX(40px); }
            }
        `;
        document.head.appendChild(style);
    }

    // ==================== Confirm Dialog ====================
    let confirmDialogResolve = null;

    function showConfirm(title, message, options = {}) {
        return new Promise(resolve => {
            confirmDialogResolve = resolve;
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            document.getElementById('confirm-icon').textContent = options.icon || '⚠';
            const okBtn = document.getElementById('confirm-ok-btn');
            const cancelBtn = document.getElementById('confirm-cancel-btn');
            okBtn.textContent = options.okText || 'OK';
            okBtn.className = 'btn btn-sm px-3 ' + (options.okClass || 'btn-primary');
            cancelBtn.style.display = options.hideCancel ? 'none' : '';
            document.getElementById('confirm-dialog').style.display = 'block';
        });
    }

    function hideConfirm() {
        document.getElementById('confirm-dialog').style.display = 'none';
        if (confirmDialogResolve) {
            confirmDialogResolve(false);
            confirmDialogResolve = null;
        }
    }

    // Override window.alert
    window._nativeAlert = window.alert;
    window.alert = function(message) {
        showConfirm('', message, { icon: 'ℹ', okText: 'OK', hideCancel: true, okClass: 'btn-primary' });
    };

    // Override window.confirm
    window._nativeConfirm = window.confirm;
    window.confirm = function(message) {
        return showConfirm('Confirm', message, { icon: '⚠', okText: 'Confirm', okClass: 'btn-danger' });
    };
</script>
