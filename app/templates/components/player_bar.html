<!-- Fixed Bottom Audio Player Bar -->
<div id="player-bar" class="player-bar" style="display: none;">
    <div class="player-bar-inner">
        <!-- Track Info (left) -->
        <div class="player-bar-info">
            <i class="bi bi-music-note-beamed text-primary me-2"></i>
            <div class="player-bar-text">
                <div class="player-bar-title" id="player-bar-title">—</div>
                <div class="player-bar-filename" id="player-bar-filename"></div>
            </div>
        </div>

        <!-- Controls (center) -->
        <div class="player-bar-controls">
            <button class="player-btn" onclick="playerPrev()" title="Previous">
                <i class="bi bi-skip-start-fill"></i>
            </button>
            <button class="player-btn player-btn-play" onclick="playerTogglePlay()" title="Play/Pause">
                <i class="bi bi-play-fill" id="player-play-icon"></i>
            </button>
            <button class="player-btn" onclick="playerNext()" title="Next">
                <i class="bi bi-skip-end-fill"></i>
            </button>
        </div>

        <!-- Progress + Time (right-center) -->
        <div class="player-bar-progress">
            <span class="player-time" id="player-current-time">0:00</span>
            <div class="player-progress-track" id="player-progress-track" onmousedown="playerSeekStart(event)">
                <div class="player-progress-fill" id="player-progress-fill"></div>
                <div class="player-progress-thumb" id="player-progress-thumb"></div>
            </div>
            <span class="player-time" id="player-total-time">0:00</span>
        </div>

        <!-- Volume (right) -->
        <div class="player-bar-volume">
            <button class="player-btn player-btn-sm" onclick="playerToggleMute()" title="Mute">
                <i class="bi bi-volume-up" id="player-volume-icon"></i>
            </button>
            <input type="range" class="player-volume-slider" id="player-volume-slider"
                   min="0" max="100" value="80" oninput="playerSetVolume(this.value)">
        </div>

        <!-- Playlist indicator -->
        <div class="player-bar-playlist-info" id="player-playlist-info" title="Playlist">
            <span id="player-track-index">1/1</span>
        </div>
    </div>

    <audio id="player-audio" preload="auto"></audio>
</div>

<style>
.player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 1100;
    background: var(--bs-body-bg);
    border-top: 1px solid var(--bs-border-color);
    box-shadow: 0 -2px 12px rgba(0,0,0,0.25);
    height: 64px;
}
.player-bar-inner {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 16px;
    gap: 16px;
}
/* Track info */
.player-bar-info {
    display: flex;
    align-items: center;
    min-width: 0;
    flex: 1;
    max-width: 280px;
}
.player-bar-text {
    min-width: 0;
    overflow: hidden;
}
.player-bar-title {
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
}
.player-bar-filename {
    font-size: 0.7rem;
    color: var(--bs-secondary-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
/* Controls */
.player-bar-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
}
.player-btn {
    background: none;
    border: none;
    color: var(--bs-body-color);
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-size: 1rem;
}
.player-btn:hover {
    background: var(--bs-tertiary-bg);
    color: var(--bs-primary);
}
.player-btn-play {
    width: 40px;
    height: 40px;
    background: var(--bs-primary);
    color: white;
    font-size: 1.1rem;
}
.player-btn-play:hover {
    background: var(--bs-primary);
    opacity: 0.85;
    color: white;
}
.player-btn-sm { font-size: 0.9rem; padding: 4px; }
/* Progress */
.player-bar-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 2;
    min-width: 0;
}
.player-time {
    font-size: 0.72rem;
    font-family: monospace;
    color: var(--bs-secondary-color);
    min-width: 36px;
    text-align: center;
    flex-shrink: 0;
}
.player-progress-track {
    flex: 1;
    height: 4px;
    background: var(--bs-tertiary-bg);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    transition: height 0.15s;
}
.player-progress-track:hover {
    height: 6px;
}
.player-progress-fill {
    height: 100%;
    background: var(--bs-primary);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
    position: relative;
}
.player-progress-thumb {
    display: none;
    width: 12px;
    height: 12px;
    background: var(--bs-primary);
    border-radius: 50%;
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    right: -6px;
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
}
.player-progress-track:hover .player-progress-thumb { display: block; }
/* Volume */
.player-bar-volume {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
}
.player-volume-slider {
    width: 80px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--bs-tertiary-bg);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
}
.player-volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--bs-primary);
    border-radius: 50%;
    cursor: pointer;
}
.player-volume-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    background: var(--bs-primary);
    border-radius: 50%;
    cursor: pointer;
    border: none;
}
/* Playlist info */
.player-bar-playlist-info {
    font-size: 0.7rem;
    color: var(--bs-secondary-color);
    flex-shrink: 0;
    text-align: right;
    min-width: 36px;
}
/* Play button in file list */
.file-play-btn {
    background: none;
    border: none;
    color: var(--bs-primary);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.15s;
}
.file-row:hover .file-play-btn { opacity: 1; }
.file-play-btn:hover { background: rgba(var(--bs-primary-rgb), 0.15); }
/* Download button in file list */
.file-download-btn {
    background: none;
    border: none;
    color: var(--bs-secondary);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.85rem;
    opacity: 0;
    transition: opacity 0.15s;
}
.file-row:hover .file-download-btn { opacity: 1; }
.file-download-btn:hover { color: var(--bs-success); background: rgba(var(--bs-success-rgb), 0.15); }
/* Responsive */
@media (max-width: 768px) {
    .player-bar-inner { padding: 0 10px; gap: 8px; }
    .player-bar-info { max-width: 120px; }
    .player-bar-volume { display: none; }
    .player-bar-progress { flex: 1; }
}
@media (max-width: 480px) {
    .player-bar-info { display: none; }
}
</style>

<script>
    // ==================== Audio Player State ====================
    let playerAudio = null;
    let playerPlaylist = [];
    let playerCurrentIndex = -1;
    let playerIsPlaying = false;
    let playerSeekDragging = false;
    const PLAYER_STORAGE_KEY = 'nas_player_state';

    // ==================== Persistence ====================
    function savePlayerState() {
        if (!playerAudio || !playerAudio.src) return;
        const state = {
            playlist: playerPlaylist,
            index: playerCurrentIndex,
            position: playerAudio.currentTime,
            volume: playerAudio.volume,
        };
        try { localStorage.setItem(PLAYER_STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
    }

    function loadPlayerState() {
        try {
            const raw = localStorage.getItem(PLAYER_STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch(e) { return null; }
    }

    // ==================== Init ====================
    document.addEventListener('DOMContentLoaded', function() {
        playerAudio = document.getElementById('player-audio');

        // Audio events
        playerAudio.addEventListener('timeupdate', playerUpdateTime);
        playerAudio.addEventListener('loadedmetadata', playerOnMetadata);
        playerAudio.addEventListener('ended', playerOnEnded);
        playerAudio.addEventListener('play', function() {
            playerIsPlaying = true;
            document.getElementById('player-play-icon').className = 'bi bi-pause-fill';
        });
        playerAudio.addEventListener('pause', function() {
            playerIsPlaying = false;
            document.getElementById('player-play-icon').className = 'bi bi-play-fill';
            savePlayerState();
        });
        playerAudio.addEventListener('error', function(e) {
            console.error('Audio error:', e);
            document.getElementById('player-bar-title').textContent = 'Error loading audio';
        });

        // Save state periodically
        playerAudio.addEventListener('timeupdate', function() {
            if (Math.floor(playerAudio.currentTime) % 5 === 0) savePlayerState();
        });

        // Restore saved state
        const saved = loadPlayerState();
        if (saved && saved.playlist && saved.index >= 0 && saved.playlist[saved.index]) {
            playerPlaylist = saved.playlist;
            playerCurrentIndex = saved.index;
            const track = saved.playlist[saved.index];

            // Restore volume
            if (typeof saved.volume === 'number') {
                playerAudio.volume = saved.volume;
                document.getElementById('player-volume-slider').value = Math.round(saved.volume * 100);
                updateVolumeIcon(Math.round(saved.volume * 100));
            }

            // Show player bar and load track
            const bar = document.getElementById('player-bar');
            bar.style.display = 'block';
            document.body.classList.add('player-active');
            document.getElementById('player-bar-title').textContent = track.name;
            document.getElementById('player-bar-filename').textContent = track.path;
            document.getElementById('player-track-index').textContent =
                (playerCurrentIndex + 1) + '/' + playerPlaylist.length;

            playerAudio.src = '/api/audio/stream?path=' + encodeURIComponent(track.path);

            // Seek to saved position once metadata loads
            const seekTo = saved.position || 0;
            playerAudio.addEventListener('loadedmetadata', function onMeta() {
                playerAudio.removeEventListener('loadedmetadata', onMeta);
                if (seekTo > 0) {
                    playerAudio.currentTime = seekTo;
                    document.getElementById('player-current-time').textContent = formatPlayerTime(seekTo);
                }
                // Don't auto-play on restore — just show paused state
            });
            playerAudio.load();
        }
    });

    // Save on page unload
    window.addEventListener('beforeunload', savePlayerState);

    // ==================== Core Play Functions ====================
    function playTrack(filepath, filename) {
        // Build playlist from current directory's audio files
        buildPlaylistFromCurrentDir();

        // Find this track in playlist
        const idx = playerPlaylist.findIndex(t => t.path === filepath);
        if (idx >= 0) {
            playerCurrentIndex = idx;
        } else {
            playerPlaylist.push({ path: filepath, name: filename });
            playerCurrentIndex = playerPlaylist.length - 1;
        }

        playerLoadAndPlay(filepath, filename);
    }

    function playerLoadAndPlay(filepath, filename) {
        // Show player bar
        const bar = document.getElementById('player-bar');
        bar.style.display = 'block';
        document.body.classList.add('player-active');

        // Update UI
        document.getElementById('player-bar-title').textContent = filename;
        document.getElementById('player-bar-filename').textContent = filepath;
        document.getElementById('player-current-time').textContent = '0:00';
        document.getElementById('player-total-time').textContent = '0:00';
        document.getElementById('player-progress-fill').style.width = '0%';
        document.getElementById('player-track-index').textContent =
            (playerCurrentIndex + 1) + '/' + playerPlaylist.length;

        // Highlight current track in file list
        document.querySelectorAll('.file-row').forEach(r => r.classList.remove('table-warning'));
        const row = document.querySelector('.file-row[data-path="' + CSS.escape(filepath) + '"]');
        if (row) row.classList.add('table-warning');

        // Load and play
        playerAudio.src = '/api/audio/stream?path=' + encodeURIComponent(filepath);
        playerAudio.load();
        playerAudio.play().catch(e => console.log('Play blocked:', e));
        savePlayerState();
    }

    function playerTogglePlay() {
        if (!playerAudio.src) return;
        if (playerIsPlaying) {
            playerAudio.pause();
        } else {
            playerAudio.play().catch(e => console.log('Play blocked:', e));
        }
    }

    function playerNext() {
        if (playerPlaylist.length === 0) return;
        playerCurrentIndex = (playerCurrentIndex + 1) % playerPlaylist.length;
        const track = playerPlaylist[playerCurrentIndex];
        playerLoadAndPlay(track.path, track.name);
    }

    function playerPrev() {
        if (playerPlaylist.length === 0) return;
        // If more than 3 seconds in, restart current track
        if (playerAudio.currentTime > 3) {
            playerAudio.currentTime = 0;
            return;
        }
        playerCurrentIndex = (playerCurrentIndex - 1 + playerPlaylist.length) % playerPlaylist.length;
        const track = playerPlaylist[playerCurrentIndex];
        playerLoadAndPlay(track.path, track.name);
    }

    // ==================== Playlist ====================
    function buildPlaylistFromCurrentDir() {
        const rows = document.querySelectorAll('.file-row[data-type="audio"]');
        const newPlaylist = [];
        rows.forEach(row => {
            newPlaylist.push({
                path: row.dataset.path,
                name: row.dataset.name
            });
        });
        if (newPlaylist.length > 0) {
            playerPlaylist = newPlaylist;
        }
    }

    // ==================== Progress & Seek ====================
    function playerUpdateTime() {
        if (playerSeekDragging || !playerAudio.duration) return;
        const pct = (playerAudio.currentTime / playerAudio.duration) * 100;
        document.getElementById('player-progress-fill').style.width = pct + '%';
        document.getElementById('player-current-time').textContent = formatPlayerTime(playerAudio.currentTime);
    }

    function playerOnMetadata() {
        document.getElementById('player-total-time').textContent = formatPlayerTime(playerAudio.duration);
    }

    function playerOnEnded() {
        // Auto-play next track
        if (playerCurrentIndex < playerPlaylist.length - 1) {
            playerNext();
        } else {
            document.getElementById('player-play-icon').className = 'bi bi-play-fill';
            playerIsPlaying = false;
            document.getElementById('player-progress-fill').style.width = '0%';
            document.getElementById('player-current-time').textContent = '0:00';
        }
    }

    function playerSeekStart(e) {
        playerSeekDragging = true;
        playerSeekUpdate(e);
        document.addEventListener('mousemove', playerSeekUpdate);
        document.addEventListener('mouseup', playerSeekEnd);
    }

    function playerSeekUpdate(e) {
        const track = document.getElementById('player-progress-track');
        const rect = track.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        document.getElementById('player-progress-fill').style.width = (pct * 100) + '%';
        if (playerAudio.duration) {
            document.getElementById('player-current-time').textContent = formatPlayerTime(pct * playerAudio.duration);
        }
    }

    function playerSeekEnd(e) {
        playerSeekDragging = false;
        document.removeEventListener('mousemove', playerSeekUpdate);
        document.removeEventListener('mouseup', playerSeekEnd);
        const track = document.getElementById('player-progress-track');
        const rect = track.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        if (playerAudio.duration) {
            playerAudio.currentTime = pct * playerAudio.duration;
        }
    }

    // ==================== Volume ====================
    function playerSetVolume(val) {
        playerAudio.volume = val / 100;
        updateVolumeIcon(val);
        savePlayerState();
    }

    function playerToggleMute() {
        if (playerAudio.volume > 0) {
            playerAudio._prevVolume = playerAudio.volume;
            playerAudio.volume = 0;
            document.getElementById('player-volume-slider').value = 0;
            updateVolumeIcon(0);
        } else {
            const prev = playerAudio._prevVolume || 0.8;
            playerAudio.volume = prev;
            document.getElementById('player-volume-slider').value = prev * 100;
            updateVolumeIcon(prev * 100);
        }
        savePlayerState();
    }

    function updateVolumeIcon(val) {
        const icon = document.getElementById('player-volume-icon');
        if (val == 0) icon.className = 'bi bi-volume-mute';
        else if (val < 50) icon.className = 'bi bi-volume-down';
        else icon.className = 'bi bi-volume-up';
    }

    // ==================== Helpers ====================
    function formatPlayerTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        // Don't trigger if typing in an input
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (!playerAudio || !playerAudio.src) return;

        if (e.code === 'Space') {
            e.preventDefault();
            playerTogglePlay();
        } else if (e.code === 'ArrowRight' && e.shiftKey) {
            playerNext();
        } else if (e.code === 'ArrowLeft' && e.shiftKey) {
            playerPrev();
        }
    });
</script>
