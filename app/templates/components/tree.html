<div class="directory-tree" id="directory-tree">
    <!-- Root node -->
    <div class="tree-node root-node">
        <div class="tree-node-header {% if tree.is_selected %}selected{% endif %}"
             hx-get="/api/files/tree/children?path=/&selected={{ selected }}"
             hx-target="#tree-children-{{ tree.path | path_to_id }}"
             hx-swap="innerHTML"
             onclick="selectDirectory('/', event)">
            <span class="tree-toggle expanded"
                  onclick="event.stopPropagation(); toggleTreeNode('/')">
                <span class="toggle-icon">▼</span>
            </span>
            <span class="tree-icon">💾</span>
            <span class="tree-label">{{ tree.name }}</span>
        </div>
        <div class="tree-children" id="tree-children-{{ tree.path | path_to_id }}">
            {% for child in tree.children %}
                {% include "components/tree_node.html" %}
            {% endfor %}
        </div>
    </div>
</div>
